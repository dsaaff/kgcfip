name = "kgcfip"
compatibility_date = "2026-03-09"

# Worker 入口：functions/ 目录编译产物（npm run build 时自动生成）
main = ".worker/index.js"

# 静态资源：vite 构建产物
[assets]
directory = "./dist"
binding = "ASSETS"
# SPA 路由：刷新非根路径时返回 index.html
# （默认行为：先匹配静态资源，未匹配的路径如 /api/* 自动进 Worker 脚本）
not_found_handling = "single-page-application"

# KV 绑定：id 换成真实 KV namespace ID
# （Dashboard → Storage & Databases → KV → 复制 ID）
[[kv_namespaces]]
binding = "IP_KV"
id = "你自己的KV ID"
preview_id = "local_kv_preview_id"

# 注意：这里故意不写 [vars]！
# LOGINPW / JWT_SECRET / APITOKEN 在 Dashboard 配置：
# Workers 项目 → Settings → Variables and Secrets
# 写占位符在这里会覆盖 Dashboard 的真实密码，导致登录失败
